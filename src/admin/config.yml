# =============================================================================
# Decap CMS — TPS Installations
#
# IMPORTANT: Decap writes back ONLY the fields declared below. If you add a
# field to content.json and not here, the CMS DELETES it the next time anyone
# saves. Run 'npm run check' — tools/check-cms.js catches exactly that.
#
# Layout: sections are ordered by how often they get edited. Everyday stuff
# first, page text in the middle, technical settings last under ⚙️.
# =============================================================================

backend:
  name: git-gateway
  branch: main
  commit_messages:
    update: 'Content: update {{collection}} “{{slug}}”'
    openAuthoring: 'Content: {{message}}'

# local_backend: true

media_folder: "src/assets/img"
public_folder: "/assets/img"

publish_mode: simple
site_url: https://tpsinstallations.netlify.app
display_url: https://tpsinstallations.netlify.app
logo_url: /assets/img/logo.svg

collections:
  - name: "content"
    label: "✏️ Edit your website"
    label_singular: "website"
    delete: false
    editor:
      preview: false
    files:
      - name: "settings"
        label: "Your website — all pages & details"
        file: "content.json"
        description: "Open a section, make your change, then press Publish at the top. The live site updates about 2 minutes later."
        fields:
          - { name: "_README", label: "Internal notes (leave alone)", widget: "hidden" }

          # ===============================================================
          # EVERYDAY
          # ===============================================================
          - name: "contact"
            label: "📞 Phone, email & opening hours"
            widget: "object"
            collapsed: true
            hint: "Keep these exactly the same as your Google Business Profile."
            fields:
              - { name: "phoneDisplay", label: "Phone number (as people see it)", widget: "string", hint: "e.g. 07971 088302" }
              - { name: "phoneLink", label: "Phone number (for the tap-to-call button)", widget: "string", hint: "International format, no spaces, e.g. +447971088302" }
              - { name: "email", label: "Email address", widget: "string" }
              - { name: "whatsappNumber", label: "WhatsApp number", widget: "string", hint: "Digits only, e.g. 447971088302" }
              - { name: "whatsappMessage", label: "Message that's pre-typed when someone opens WhatsApp", widget: "string" }
              - name: "openingHours"
                label: "Opening hours"
                widget: "list"
                collapsed: true
                summary: "{{fields.days}}: {{fields.hours}}"
                fields:
                  - { name: "days", label: "Days", widget: "string", hint: "e.g. Monday to Friday" }
                  - { name: "hours", label: "Hours", widget: "string", hint: "e.g. 7:30am to 6pm, or Closed" }
                  - { name: "schema", label: "Google format (optional)", widget: "string", required: false, hint: "e.g. Mo-Fr 07:30-18:00. Leave blank for closed days." }
              - { name: "responseTimePromise", label: "How quickly you reply", widget: "text" }
              - { name: "freeEstimates", label: "Free quotes line", widget: "string", required: false }
              - name: "address"
                label: "Business address"
                widget: "object"
                collapsed: true
                fields:
                  - { name: "street", label: "Street", widget: "string", required: false }
                  - { name: "locality", label: "Town", widget: "string" }
                  - { name: "region", label: "County", widget: "string" }
                  - { name: "postcode", label: "Postcode", widget: "string" }
                  - { name: "country", label: "Country code", widget: "string", default: "GB" }
              - { name: "serviceRadiusMiles", label: "How far you travel (miles)", widget: "number", value_type: "int" }
              - { name: "checkatradeUrl", label: "Checkatrade profile link", widget: "string", required: false }
              - { name: "googleReviewsUrl", label: "Google reviews link", widget: "string", required: false }
              - { name: "googleBusinessProfileUrl", label: "Google Business Profile link", widget: "string", required: false }
              - { name: "googleRating", label: "Google star rating", widget: "string", required: false, hint: "e.g. 4.9" }
              - { name: "googleReviewCount", label: "Number of Google reviews", widget: "string", required: false }
              - name: "geo"
                label: "Map pin (latitude / longitude)"
                widget: "object"
                collapsed: true
                fields:
                  - { name: "latitude", label: "Latitude", widget: "number", value_type: "float" }
                  - { name: "longitude", label: "Longitude", widget: "number", value_type: "float" }

          - name: "testimonials"
            label: "⭐ Customer reviews"
            label_singular: "review"
            widget: "list"
            collapsed: true
            summary: "{{fields.rating}}★  {{fields.name}}, {{fields.location}}"
            hint: "Real reviews only. Made-up reviews are illegal in the UK."
            fields:
              - { name: "quote", label: "What they said", widget: "text" }
              - { name: "name", label: "Customer name", widget: "string", hint: "e.g. Sarah T." }
              - { name: "location", label: "Their town", widget: "string" }
              - { name: "rating", label: "Stars (1 to 5)", widget: "number", value_type: "int", min: 1, max: 5 }
              - { name: "date", label: "Date", widget: "string", required: false }
              - { name: "service", label: "Which service (optional)", widget: "string", required: false, hint: "Use the service's web address name, e.g. driveways-paving" }

          - name: "work"
            label: "📸 Photos of our work"
            label_singular: "photo"
            widget: "list"
            collapsed: true
            summary: "{{fields.alt}}"
            hint: "The first six show on the homepage; all of them show on the gallery page. Drag to reorder."
            fields:
              - { name: "image", label: "Photo", widget: "image" }
              - { name: "alt", label: "Describe the photo", widget: "string", hint: "What's actually in the picture, e.g. Block-paved driveway with granite edging" }
              - { name: "id", label: "Reference (any unique word)", widget: "string", hint: "e.g. driveway-3" }

          - name: "gallery"
            label: "🔁 Before & after photos"
            label_singular: "before & after"
            widget: "list"
            collapsed: true
            summary: "{{fields.title}}"
            fields:
              - { name: "title", label: "Job title", widget: "string" }
              - { name: "caption", label: "Short description", widget: "text" }
              - { name: "beforeImage", label: "Before photo", widget: "image", required: false }
              - { name: "beforeAlt", label: "Describe the before photo", widget: "string" }
              - { name: "afterImage", label: "After photo", widget: "image", required: false }
              - { name: "afterAlt", label: "Describe the after photo", widget: "string" }
              - { name: "service", label: "Which service (optional)", widget: "string", required: false }
              - { name: "area", label: "Which town (optional)", widget: "string", required: false }
              - { name: "id", label: "Reference (any unique word)", widget: "string" }

          - name: "faqs"
            label: "❓ Questions & answers"
            label_singular: "question"
            widget: "list"
            collapsed: true
            summary: "{{fields.question}}"
            hint: "Google can show these directly in search results."
            fields:
              - { name: "question", label: "Question", widget: "string" }
              - { name: "answer", label: "Answer", widget: "text" }
              - { name: "scope", label: "Scope", widget: "select", options: ["global"], default: "global" }

          # ===============================================================
          # SERVICES & AREAS
          # ===============================================================
          - name: "services"
            label: "🛠️ Services"
            label_singular: "service"
            widget: "list"
            collapsed: true
            summary: "{{fields.name}}"
            hint: "Each service gets its own page. Adding one creates a new page on the site."
            fields:
              - { name: "name", label: "Service name", widget: "string" }
              - { name: "shortName", label: "Short name (used in menus)", widget: "string" }
              - { name: "image", label: "Photo", widget: "image", required: false }
              - { name: "imageAlt", label: "Describe the photo", widget: "string" }
              - { name: "eyebrow", label: "Small line above the card title", widget: "string", required: false }
              - { name: "cardSummary", label: "Card text (homepage & services page)", widget: "text" }
              - { name: "h1", label: "Page headline", widget: "string" }
              - { name: "intro", label: "Opening paragraph (40–60 words)", widget: "text" }
              - { name: "body", label: "Main text", widget: "text", hint: "Leave an empty line between paragraphs." }
              - { name: "bullets", label: "What's included", widget: "list", collapsed: false, field: { name: "point", label: "Point", widget: "string" } }
              - { name: "priceLabel", label: "Price heading", widget: "string", required: false }
              - { name: "priceFrom", label: "Price from", widget: "string", required: false, hint: "Leave blank to hide prices on this page." }
              - { name: "slug", label: "Web address", widget: "string", hint: "Lowercase and hyphens only, e.g. driveways-paving. Changing this changes the page's link.", pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', "Lowercase letters, numbers and hyphens only"] }
              - name: "seo"
                label: "Google search listing"
                widget: "object"
                collapsed: true
                fields:
                  - { name: "title", label: "Title in Google (max 60 characters)", widget: "string", pattern: ['^.{1,60}$', "60 characters max"] }
                  - { name: "description", label: "Description in Google (max 155 characters)", widget: "text", pattern: ['^.{1,155}$', "155 characters max"] }

          - name: "areas"
            label: "📍 Towns you cover"
            label_singular: "town"
            widget: "list"
            collapsed: true
            summary: "{{fields.name}}"
            hint: "Each town gets its own page."
            fields:
              - { name: "name", label: "Town name", widget: "string" }
              - { name: "county", label: "County", widget: "string" }
              - { name: "postcodes", label: "Postcodes covered", widget: "string", required: false }
              - { name: "intro", label: "Opening paragraph (40–60 words, different for every town)", widget: "text" }
              - { name: "localReference", label: "Something local and true", widget: "text", hint: "e.g. a road you've worked on or a local detail" }
              - { name: "slug", label: "Web address", widget: "string", hint: "Lowercase and hyphens only, e.g. ferndown", pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', "Lowercase letters, numbers and hyphens only"] }
              - name: "seo"
                label: "Google search listing"
                widget: "object"
                collapsed: true
                fields:
                  - { name: "title", label: "Title in Google (max 60 characters)", widget: "string", pattern: ['^.{1,60}$', "60 characters max"] }
                  - { name: "description", label: "Description in Google (max 155 characters)", widget: "text", pattern: ['^.{1,155}$', "155 characters max"] }

          - name: "locationPages"
            label: "🗺️ Town + service pages (e.g. Roofing in Poole)"
            label_singular: "town + service page"
            widget: "list"
            collapsed: true
            summary: "{{fields.h1}}"
            hint: "Every page needs its own wording. Copy-pasted text gets ignored by Google."
            fields:
              - { name: "h1", label: "Page headline", widget: "string" }
              - { name: "intro", label: "Main text (120–180 words, unique)", widget: "text" }
              - { name: "localReference", label: "Something local and true", widget: "text" }
              - { name: "areaSlug", label: "Town web address", widget: "string", hint: "Must match a town's web address, e.g. poole" }
              - { name: "serviceSlug", label: "Service web address", widget: "string", hint: "Must match a service's web address, e.g. roofing" }
              - name: "seo"
                label: "Google search listing"
                widget: "object"
                collapsed: true
                fields:
                  - { name: "title", label: "Title in Google (max 60 characters)", widget: "string", pattern: ['^.{1,60}$', "60 characters max"] }
                  - { name: "description", label: "Description in Google (max 155 characters)", widget: "text", pattern: ['^.{1,155}$', "155 characters max"] }

          # ===============================================================
          # PAGE TEXT
          # ===============================================================
          - name: "pages"
            label: "📄 Page text (headings & paragraphs)"
            widget: "object"
            collapsed: true
            hint: "Open the page you want to change."
            fields:
              - name: "home"
                label: "🏠 Homepage"
                widget: "object"
                collapsed: true
                fields:
                  - { name: "heroEyebrow", label: "Top: small line above the headline", widget: "string" }
                  - { name: "heroHeadline", label: "Top: big headline", widget: "string" }
                  - { name: "heroHeadlineAccent", label: "Top: word in the headline to show in italics", widget: "string", required: false }
                  - { name: "heroSubheadline", label: "Top: paragraph under the headline", widget: "text" }
                  - { name: "heroImage", label: "Top: background photo", widget: "image", required: false }
                  - { name: "heroImageAlt", label: "Top: describe the photo", widget: "string" }
                  - { name: "servicesEyebrow", label: "Services: small line", widget: "string" }
                  - { name: "servicesHeading", label: "Services: heading", widget: "string" }
                  - { name: "servicesIntro", label: "Services: paragraph", widget: "text" }
                  - { name: "galleryEyebrow", label: "Photos: small line", widget: "string" }
                  - { name: "galleryHeading", label: "Photos: heading", widget: "string" }
                  - { name: "galleryIntro", label: "Photos: paragraph", widget: "text" }
                  - { name: "aboutEyebrow", label: "About: small line", widget: "string" }
                  - { name: "aboutHeading", label: "About: heading", widget: "string" }
                  - { name: "aboutBody", label: "About: paragraph", widget: "text" }
                  - { name: "aboutImage", label: "About: photo", widget: "image", required: false }
                  - { name: "aboutImageAlt", label: "About: describe the photo", widget: "string" }
                  - { name: "testimonialsEyebrow", label: "Reviews: small line", widget: "string" }
                  - { name: "testimonialsHeading", label: "Reviews: heading", widget: "string" }
                  - { name: "testimonialsIntro", label: "Reviews: paragraph", widget: "text", required: false }
                  - { name: "areasEyebrow", label: "Towns: small line", widget: "string" }
                  - { name: "areasHeading", label: "Towns: heading", widget: "string" }
                  - { name: "areasIntro", label: "Towns: paragraph", widget: "text" }
                  - { name: "faqEyebrow", label: "Questions: small line", widget: "string" }
                  - { name: "faqHeading", label: "Questions: heading", widget: "string" }
                  - { name: "faqIntro", label: "Questions: paragraph", widget: "text", required: false }
                  - { name: "seo", label: "Google search listing", widget: "object", collapsed: true, fields: [
                      { name: "title", label: "Title in Google (max 60 characters)", widget: "string", pattern: ['^.{1,60}$', "60 characters max"] },
                      { name: "description", label: "Description in Google (max 155 characters)", widget: "text", pattern: ['^.{1,155}$', "155 characters max"] } ] }
              - name: "about"
                label: "👷 About page"
                widget: "object"
                collapsed: true
                fields:
                  - { name: "h1", label: "Headline", widget: "string" }
                  - { name: "intro", label: "Opening paragraph", widget: "text" }
                  - { name: "body", label: "Main text", widget: "text" }
                  - { name: "image", label: "Photo", widget: "image", required: false }
                  - { name: "imageAlt", label: "Describe the photo", widget: "string" }
                  - { name: "valuesHeading", label: "Values heading", widget: "string" }
                  - { name: "values", label: "Values", widget: "list", collapsed: true, summary: "{{fields.title}}", fields: [
                      { name: "title", label: "Title", widget: "string" },
                      { name: "body", label: "Text", widget: "text" } ] }
                  - { name: "seo", label: "Google search listing", widget: "object", collapsed: true, fields: [
                      { name: "title", label: "Title in Google (max 60 characters)", widget: "string", pattern: ['^.{1,60}$', "60 characters max"] },
                      { name: "description", label: "Description in Google (max 155 characters)", widget: "text", pattern: ['^.{1,155}$', "155 characters max"] } ] }
              - name: "services"
                label: "🛠️ Services page (the list of all services)"
                widget: "object"
                collapsed: true
                fields:
                  - { name: "h1", label: "Headline", widget: "string" }
                  - { name: "intro", label: "Opening paragraph", widget: "text" }
                  - { name: "gridHeading", label: "Heading above the services", widget: "string" }
                  - { name: "seo", label: "Google search listing", widget: "object", collapsed: true, fields: [
                      { name: "title", label: "Title in Google (max 60 characters)", widget: "string", pattern: ['^.{1,60}$', "60 characters max"] },
                      { name: "description", label: "Description in Google (max 155 characters)", widget: "text", pattern: ['^.{1,155}$', "155 characters max"] } ] }
              - name: "gallery"
                label: "📸 Gallery page"
                widget: "object"
                collapsed: true
                fields:
                  - { name: "h1", label: "Headline", widget: "string" }
                  - { name: "intro", label: "Opening paragraph", widget: "text" }
                  - { name: "gridHeading", label: "Heading above the photos", widget: "string" }
                  - { name: "seo", label: "Google search listing", widget: "object", collapsed: true, fields: [
                      { name: "title", label: "Title in Google (max 60 characters)", widget: "string", pattern: ['^.{1,60}$', "60 characters max"] },
                      { name: "description", label: "Description in Google (max 155 characters)", widget: "text", pattern: ['^.{1,155}$', "155 characters max"] } ] }
              - name: "areas"
                label: "📍 Areas page (the list of all towns)"
                widget: "object"
                collapsed: true
                fields:
                  - { name: "h1", label: "Headline", widget: "string" }
                  - { name: "intro", label: "Opening paragraph", widget: "text" }
                  - { name: "seo", label: "Google search listing", widget: "object", collapsed: true, fields: [
                      { name: "title", label: "Title in Google (max 60 characters)", widget: "string", pattern: ['^.{1,60}$', "60 characters max"] },
                      { name: "description", label: "Description in Google (max 155 characters)", widget: "text", pattern: ['^.{1,155}$', "155 characters max"] } ] }
              - name: "contact"
                label: "✉️ Contact page"
                widget: "object"
                collapsed: true
                fields:
                  - { name: "h1", label: "Headline", widget: "string" }
                  - { name: "intro", label: "Opening paragraph", widget: "text" }
                  - { name: "seo", label: "Google search listing", widget: "object", collapsed: true, fields: [
                      { name: "title", label: "Title in Google (max 60 characters)", widget: "string", pattern: ['^.{1,60}$', "60 characters max"] },
                      { name: "description", label: "Description in Google (max 155 characters)", widget: "text", pattern: ['^.{1,155}$', "155 characters max"] } ] }
              - name: "thanks"
                label: "✅ Thank-you page (after someone sends the form)"
                widget: "object"
                collapsed: true
                fields:
                  - { name: "h1", label: "Headline", widget: "string" }
                  - { name: "body", label: "Text", widget: "text" }
                  - { name: "seo", label: "Google search listing", widget: "object", collapsed: true, fields: [
                      { name: "title", label: "Title", widget: "string" },
                      { name: "description", label: "Description", widget: "text" } ] }
              - name: "privacy"
                label: "🔒 Privacy policy"
                widget: "object"
                collapsed: true
                fields:
                  - { name: "h1", label: "Headline", widget: "string" }
                  - { name: "lastUpdated", label: "Last updated", widget: "string", required: false }
                  - { name: "body", label: "Policy text", widget: "text" }
                  - { name: "seo", label: "Google search listing", widget: "object", collapsed: true, fields: [
                      { name: "title", label: "Title", widget: "string" },
                      { name: "description", label: "Description", widget: "text" } ] }
              - name: "notFound"
                label: "🚧 Page-not-found (404) page"
                widget: "object"
                collapsed: true
                fields:
                  - { name: "h1", label: "Headline", widget: "string" }
                  - { name: "body", label: "Text", widget: "text" }
                  - { name: "seo", label: "Google search listing", widget: "object", collapsed: true, fields: [
                      { name: "title", label: "Title", widget: "string" },
                      { name: "description", label: "Description", widget: "text" } ] }

          # ===============================================================
          # HOMEPAGE SECTIONS
          # ===============================================================
          - name: "trust"
            label: "🏅 Stats, insurance & accreditations"
            widget: "object"
            collapsed: true
            fields:
              - { name: "yearsTrading", label: "Years trading (number)", widget: "string" }
              - { name: "yearsTradingLabel", label: "Years trading (label)", widget: "string" }
              - { name: "projectsCompleted", label: "Jobs completed (number)", widget: "string" }
              - { name: "projectsCompletedLabel", label: "Jobs completed (label)", widget: "string" }
              - { name: "fixedQuotesValue", label: "Quotes stat (big text)", widget: "string" }
              - { name: "fixedQuotesLabel", label: "Quotes stat (label)", widget: "string" }
              - { name: "insuredValue", label: "Insurance stat (big text)", widget: "string" }
              - { name: "insuredLabel", label: "Insurance stat (label)", widget: "string" }
              - { name: "insuranceValue", label: "Insurer and level of cover", widget: "string" }
              - { name: "guarantee", label: "Guarantee length", widget: "string" }
              - { name: "wasteCarrierLicence", label: "Waste carrier licence number", widget: "string" }
              - { name: "strapline", label: "Strapline", widget: "text" }
              - name: "checkatrade"
                label: "Checkatrade score"
                widget: "object"
                collapsed: true
                hint: "Use the real figures from your Checkatrade profile."
                fields:
                  - { name: "_note", label: "Note", widget: "hidden" }
                  - { name: "rating", label: "Score", widget: "string", hint: "e.g. 10" }
                  - { name: "reviewCount", label: "Number of reviews", widget: "string" }
                  - { name: "memberSince", label: "Member since", widget: "string" }
                  - { name: "label", label: "Label", widget: "string" }
                  - { name: "url", label: "Profile link", widget: "string" }
              - { name: "credentialsEyebrow", label: "Credentials: small line", widget: "string" }
              - { name: "credentialsHeading", label: "Credentials: heading", widget: "string" }
              - name: "credentials"
                label: "Credentials"
                label_singular: "credential"
                widget: "list"
                collapsed: true
                summary: "{{fields.title}}"
                fields:
                  - { name: "title", label: "Title", widget: "string" }
                  - { name: "body", label: "Text", widget: "text" }
                  - { name: "flag", label: "Orange 'still to confirm' badge", widget: "string", required: false, hint: "Clear this once it's confirmed and the badge disappears." }
              - name: "accreditations"
                label: "Accreditation logos"
                label_singular: "accreditation"
                widget: "list"
                collapsed: true
                summary: "{{fields.name}}"
                hint: "Delete any you don't actually hold."
                fields:
                  - { name: "name", label: "Name", widget: "string" }
                  - { name: "logo", label: "Logo", widget: "image", required: false }
                  - { name: "alt", label: "Describe the logo", widget: "string" }
                  - { name: "url", label: "Profile link", widget: "string", required: false }
                  - { name: "membershipNumber", label: "Membership number", widget: "string", required: false }

          - name: "process"
            label: "🪜 'How it runs' steps"
            widget: "object"
            collapsed: true
            fields:
              - { name: "eyebrow", label: "Small line", widget: "string" }
              - { name: "heading", label: "Heading", widget: "string" }
              - { name: "intro", label: "Paragraph", widget: "text" }
              - name: "steps"
                label: "Steps"
                label_singular: "step"
                widget: "list"
                collapsed: true
                summary: "{{fields.title}}"
                fields:
                  - { name: "title", label: "Step title", widget: "string" }
                  - { name: "body", label: "Description", widget: "text" }
                  - { name: "timing", label: "Timing (e.g. Same day, usually)", widget: "string", required: false }

          - name: "differentiator"
            label: "🧱 'What goes underneath' section"
            widget: "object"
            collapsed: true
            hint: "The build-up diagrams. Keep the numbers accurate."
            fields:
              - { name: "eyebrow", label: "Small line", widget: "string" }
              - { name: "heading", label: "Heading", widget: "string" }
              - { name: "intro", label: "Paragraph", widget: "text" }
              - name: "buildUps"
                label: "Build-up diagrams"
                label_singular: "build-up"
                widget: "list"
                collapsed: true
                summary: "{{fields.title}}"
                fields:
                  - { name: "title", label: "Title (e.g. Under a driveway)", widget: "string" }
                  - name: "layers"
                    label: "Layers (top to bottom)"
                    label_singular: "layer"
                    widget: "list"
                    collapsed: true
                    summary: "{{fields.label}} — {{fields.spec}}"
                    fields:
                      - { name: "label", label: "Layer", widget: "string" }
                      - { name: "spec", label: "Depth / spec", widget: "string" }
                  - { name: "note", label: "Note underneath", widget: "text" }
              - { name: "closing", label: "Closing paragraph", widget: "text" }

          - name: "strip"
            label: "🔤 Scrolling trades banner"
            widget: "object"
            collapsed: true
            hint: "The moving row of trades under the top of the homepage."
            fields:
              - { name: "items", label: "Trades", widget: "list", collapsed: false, field: { name: "trade", label: "Trade", widget: "string" } }

          - name: "cta"
            label: "🔘 Buttons & call-to-action banner"
            widget: "object"
            collapsed: true
            fields:
              - { name: "primaryLabel", label: "Main button text", widget: "string", hint: "e.g. Get my free quote" }
              - { name: "primaryUrl", label: "Main button link", widget: "string" }
              - { name: "secondaryLabel", label: "Second button text", widget: "string" }
              - { name: "whatsappLabel", label: "WhatsApp button text", widget: "string" }
              - { name: "bandHeading", label: "Banner heading (near the bottom of pages)", widget: "string" }
              - { name: "bandBody", label: "Banner text", widget: "text" }

          - name: "form"
            label: "📝 Quote form wording"
            widget: "object"
            collapsed: true
            fields:
              - { name: "heading", label: "Heading", widget: "string" }
              - { name: "intro", label: "Paragraph", widget: "text" }
              - name: "steps"
                label: "Step titles"
                widget: "object"
                collapsed: true
                fields:
                  - { name: "job", label: "Step 1 (type of job)", widget: "string" }
                  - { name: "property", label: "Step 2 (postcode & details)", widget: "string" }
                  - { name: "details", label: "Step 3 (name & phone)", widget: "string" }
              - { name: "jobTypes", label: "Extra job choices", widget: "list", collapsed: false, field: { name: "option", label: "Option", widget: "string" }, hint: "Your services are listed automatically. Only add extras here, like Not sure yet." }
              - { name: "callTimes", label: "Best time to call choices", widget: "list", collapsed: false, field: { name: "option", label: "Option", widget: "string" }, hint: "Leave empty to hide the question." }
              - name: "labels"
                label: "Question labels"
                widget: "object"
                collapsed: true
                fields:
                  - { name: "jobType", label: "Job type question", widget: "string" }
                  - { name: "postcode", label: "Postcode question", widget: "string" }
                  - { name: "message", label: "Extra details question", widget: "string" }
                  - { name: "name", label: "Name question", widget: "string" }
                  - { name: "phone", label: "Phone question", widget: "string" }
                  - { name: "callTime", label: "Best time to call question", widget: "string" }
                  - { name: "optional", label: "Word shown next to optional questions", widget: "string" }
              - { name: "submitLabel", label: "Send button text", widget: "string" }
              - { name: "nextLabel", label: "Next button text", widget: "string" }
              - { name: "backLabel", label: "Back button text", widget: "string" }
              - { name: "stepCounter", label: "Step counter", widget: "string", hint: "Keep {n} and {total} in it, e.g. Step {n} of {total}" }
              - { name: "pickJobMessage", label: "Message if they press Next without picking a job", widget: "string" }
              - { name: "privacyNote", label: "Privacy note under the form", widget: "text" }

          - name: "social"
            label: "🔗 Social media links"
            widget: "object"
            collapsed: true
            hint: "Paste the full link. Leave blank to hide that icon."
            fields:
              - { name: "facebook", label: "Facebook", widget: "string", required: false }
              - { name: "instagram", label: "Instagram", widget: "string", required: false }
              - { name: "tiktok", label: "TikTok", widget: "string", required: false }
              - { name: "youtube", label: "YouTube", widget: "string", required: false }
              - { name: "linkedin", label: "LinkedIn", widget: "string", required: false }
              - { name: "x", label: "X (Twitter)", widget: "string", required: false }

          # ===============================================================
          # ADVANCED — rarely touched
          # ===============================================================
          - name: "site"
            label: "⚙️ Advanced: company & legal details"
            widget: "object"
            collapsed: true
            hint: "Rarely needs changing."
            fields:
              - { name: "name", label: "Company name", widget: "string" }
              - { name: "legalName", label: "Registered company name", widget: "string" }
              - { name: "companyNumber", label: "Company number", widget: "string", required: false }
              - { name: "registeredIn", label: "Registered in", widget: "string", required: false, hint: "e.g. England and Wales" }
              - { name: "registeredOffice", label: "Registered office address", widget: "string", required: false, hint: "From Companies House. Required by law on the website." }
              - { name: "vatNumber", label: "VAT number", widget: "string", required: false }
              - { name: "tagline", label: "Tagline (footer)", widget: "text" }
              - { name: "logo", label: "Logo", widget: "image", required: false }
              - { name: "logoAlt", label: "Describe the logo", widget: "string" }
              - { name: "logoSubtitle", label: "Line under the logo", widget: "string", hint: "e.g. Ferndown · Dorset" }
              - { name: "defaultOgImage", label: "Picture shown when the site is shared on Facebook/WhatsApp (1200×630)", widget: "image", required: false }
              - { name: "defaultOgImageAlt", label: "Describe that picture", widget: "string" }
              - { name: "copyrightStartYear", label: "Copyright start year", widget: "number", value_type: "int" }
              - { name: "url", label: "Website address (no slash at the end)", widget: "string", hint: "e.g. https://tpsinstallations.co.uk. Google links and the sitemap use this." }
              - { name: "themeColor", label: "Browser bar colour on phones", widget: "string" }
              - { name: "locale", label: "Locale", widget: "string", default: "en_GB" }
              - { name: "language", label: "Language", widget: "string", default: "en-GB" }

          - name: "nav"
            label: "⚙️ Advanced: menu links"
            widget: "object"
            collapsed: true
            fields:
              - name: "primary"
                label: "Main menu"
                label_singular: "menu link"
                widget: "list"
                collapsed: true
                summary: "{{fields.label}}  →  {{fields.url}}"
                fields:
                  - { name: "label", label: "Text", widget: "string" }
                  - { name: "url", label: "Link", widget: "string" }
              - name: "footerLegal"
                label: "Footer links"
                label_singular: "footer link"
                widget: "list"
                collapsed: true
                summary: "{{fields.label}}  →  {{fields.url}}"
                fields:
                  - { name: "label", label: "Text", widget: "string" }
                  - { name: "url", label: "Link", widget: "string" }

          - name: "seo"
            label: "⚙️ Advanced: Google & search settings"
            widget: "object"
            collapsed: true
            fields:
              - { name: "titleSuffix", label: "Added to the end of page titles", widget: "string", hint: "Only added when the title stays under 60 characters" }
              - { name: "defaultDescription", label: "Default Google description (max 155 characters)", widget: "text", pattern: ['^.{0,155}$', "155 characters max"] }
              - { name: "googleSiteVerification", label: "Google Search Console code", widget: "string", required: false }
              - { name: "bingSiteVerification", label: "Bing Webmaster code", widget: "string", required: false }
              - { name: "twitterHandle", label: "X (Twitter) handle", widget: "string", required: false }

          - name: "analytics"
            label: "⚙️ Advanced: visitor tracking & cookie banner"
            widget: "object"
            collapsed: true
            hint: "Nothing is tracked until a provider is chosen."
            fields:
              - { name: "_note", label: "Note", widget: "hidden" }
              - { name: "provider", label: "Provider", widget: "select", options: ["", "ga4", "plausible"], required: false }
              - { name: "ga4MeasurementId", label: "Google Analytics ID", widget: "string", required: false }
              - { name: "plausibleDomain", label: "Plausible domain", widget: "string", required: false }
              - name: "consent"
                label: "Cookie banner (Google Analytics only)"
                widget: "object"
                collapsed: true
                fields:
                  - { name: "text", label: "Banner text", widget: "text" }
                  - { name: "accept", label: "Accept button", widget: "string" }
                  - { name: "reject", label: "Reject button", widget: "string" }
                  - { name: "settingsLabel", label: "Footer link to reopen it", widget: "string" }
