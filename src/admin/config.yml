# =============================================================================
# Decap CMS — TPS Installations
#
# IMPORTANT: Decap writes back ONLY the fields declared below. If you add a
# field to content.json and not here, the CMS DELETES it the next time anyone
# saves. Run `npm run check` — tools/check-cms.js catches exactly that.
# =============================================================================

# --- BACKEND -----------------------------------------------------------------
# Netlify Identity + Git Gateway. Editors log in with an email invite; no
# GitHub account needed. Saving commits to the repo and Netlify redeploys.
#
# Netlify has DEPRECATED Git Gateway: it still works and still gets security
# fixes, but no more bug fixes. To move off it later, replace this whole block
# with one of the alternatives in README.md — nothing else in this file changes.
backend:
  name: git-gateway
  branch: main
  commit_messages:
    update: 'Content: update {{collection}} “{{slug}}”'
    openAuthoring: 'Content: {{message}}'

# Turn this on to edit locally with `npx decap-server` running.
# local_backend: true

media_folder: "src/assets/img"
public_folder: "/assets/img"

publish_mode: simple
site_url: https://example.netlify.app   # replace with the live domain
display_url: https://example.netlify.app
logo_url: /assets/img/logo.svg

collections:
  - name: "content"
    label: "Website content"
    delete: false
    editor:
      preview: false
    files:
      - name: "settings"
        label: "Everything"
        file: "content.json"
        description: "All site copy, contact details, services, towns, reviews and SEO."
        fields:
          - { name: "_README", label: "Internal notes (leave alone)", widget: "hidden" }

          # ---------------------------------------------------------------
          - name: "site"
            label: "① Company"
            widget: "object"
            fields:
              - { name: "name", label: "Company name", widget: "string" }
              - { name: "legalName", label: "Registered legal name", widget: "string" }
              - { name: "tagline", label: "Tagline (footer and schema)", widget: "text" }
              - { name: "url", label: "Live site URL (no trailing slash)", widget: "string", hint: "e.g. https://tpsinstallations.co.uk — canonical tags, sitemap and Open Graph all depend on this" }
              - { name: "locale", label: "Open Graph locale", widget: "string", default: "en_GB" }
              - { name: "language", label: "HTML lang", widget: "string", default: "en-GB" }
              - { name: "companyNumber", label: "Company number", widget: "string", required: false }
              - { name: "registeredIn", label: "Registered in", widget: "string", required: false, hint: "e.g. England and Wales" }
              - { name: "registeredOffice", label: "Registered office address", widget: "string", required: false, hint: "From Companies House. The law requires it on the website." }
              - { name: "vatNumber", label: "VAT number", widget: "string", required: false }
              - { name: "logo", label: "Logo mark", widget: "image", required: false }
              - { name: "logoAlt", label: "Logo alt text", widget: "string" }
              - { name: "logoSubtitle", label: "Line under the logo", widget: "string", hint: "e.g. Ferndown · Dorset" }
              - { name: "defaultOgImage", label: "Default social share image (1200×630 JPG or PNG)", widget: "image", required: false }
              - { name: "defaultOgImageAlt", label: "Social image alt text", widget: "string" }
              - { name: "themeColor", label: "Browser theme colour", widget: "string" }
              - { name: "copyrightStartYear", label: "Copyright start year", widget: "number", value_type: "int" }

          - name: "seo"
            label: "② SEO defaults"
            widget: "object"
            fields:
              - { name: "titleSuffix", label: "Title suffix", widget: "string", hint: "Appended to page titles only when the result stays under 60 characters" }
              - { name: "defaultDescription", label: "Fallback meta description", widget: "text", pattern: ['^.{0,155}$', "155 characters max"] }
              - { name: "twitterHandle", label: "Twitter/X handle", widget: "string", required: false }
              - { name: "googleSiteVerification", label: "Google Search Console verification code", widget: "string", required: false }
              - { name: "bingSiteVerification", label: "Bing Webmaster Tools verification code", widget: "string", required: false }

          - name: "analytics"
            label: "③ Analytics"
            widget: "object"
            hint: "Nothing is loaded until a provider is chosen."
            fields:
              - { name: "_note", label: "Note", widget: "hidden" }
              - { name: "provider", label: "Provider", widget: "select", options: ["", "ga4", "plausible"], required: false }
              - { name: "ga4MeasurementId", label: "GA4 measurement ID", widget: "string", required: false }
              - { name: "plausibleDomain", label: "Plausible domain", widget: "string", required: false }
              - name: "consent"
                label: "Cookie banner (GA4 only)"
                widget: "object"
                fields:
                  - { name: "text", label: "Banner text", widget: "text" }
                  - { name: "accept", label: "Accept button", widget: "string" }
                  - { name: "reject", label: "Reject button", widget: "string" }
                  - { name: "settingsLabel", label: "Footer link to reopen it", widget: "string" }

          # ---------------------------------------------------------------
          - name: "contact"
            label: "④ Contact & NAP"
            widget: "object"
            hint: "Must match the Google Business Profile exactly — name, address, phone."
            fields:
              - { name: "phoneDisplay", label: "Phone (as displayed)", widget: "string" }
              - { name: "phoneLink", label: "Phone (for tel: links)", widget: "string", hint: "International format, e.g. +447971088302" }
              - { name: "whatsappNumber", label: "WhatsApp number", widget: "string", hint: "Digits only, e.g. 447971088302" }
              - { name: "whatsappMessage", label: "Pre-filled WhatsApp message", widget: "string" }
              - { name: "email", label: "Email", widget: "string" }
              - name: "address"
                label: "Address"
                widget: "object"
                fields:
                  - { name: "street", label: "Street", widget: "string", required: false }
                  - { name: "locality", label: "Town/city", widget: "string" }
                  - { name: "region", label: "County", widget: "string" }
                  - { name: "postcode", label: "Postcode", widget: "string" }
                  - { name: "country", label: "Country code", widget: "string", default: "GB" }
              - name: "geo"
                label: "Map coordinates"
                widget: "object"
                fields:
                  - { name: "latitude", label: "Latitude", widget: "number", value_type: "float" }
                  - { name: "longitude", label: "Longitude", widget: "number", value_type: "float" }
              - { name: "serviceRadiusMiles", label: "Service radius (miles)", widget: "number", value_type: "int" }
              - name: "openingHours"
                label: "Opening hours"
                widget: "list"
                fields:
                  - { name: "days", label: "Days", widget: "string" }
                  - { name: "hours", label: "Hours", widget: "string" }
                  - { name: "schema", label: "Schema.org format", widget: "string", required: false, hint: "e.g. Mo-Fr 07:30-18:00 — leave blank for closed days" }
              - { name: "responseTimePromise", label: "Response time promise", widget: "text" }
              - { name: "checkatradeUrl", label: "Checkatrade profile URL", widget: "string", required: false }
              - { name: "freeEstimates", label: "Free estimates line", widget: "string", required: false }
              - { name: "googleReviewsUrl", label: "Google reviews link", widget: "string", required: false }
              - { name: "googleBusinessProfileUrl", label: "Google Business Profile link", widget: "string", required: false }
              - { name: "googleRating", label: "Google rating", widget: "string", required: false }
              - { name: "googleReviewCount", label: "Google review count", widget: "string", required: false }

          - name: "social"
            label: "⑤ Social links"
            widget: "object"
            hint: "Leave blank to hide the icon."
            fields:
              - { name: "facebook", label: "Facebook", widget: "string", required: false }
              - { name: "instagram", label: "Instagram", widget: "string", required: false }
              - { name: "linkedin", label: "LinkedIn", widget: "string", required: false }
              - { name: "youtube", label: "YouTube", widget: "string", required: false }
              - { name: "tiktok", label: "TikTok", widget: "string", required: false }
              - { name: "x", label: "X", widget: "string", required: false }

          # ---------------------------------------------------------------
          - name: "trust"
            label: "⑥ Trust signals & credentials"
            widget: "object"
            fields:
              - { name: "yearsTrading", label: "Years trading (hero stat)", widget: "string" }
              - { name: "yearsTradingLabel", label: "Years label", widget: "string" }
              - { name: "projectsCompleted", label: "Projects completed (hero stat)", widget: "string" }
              - { name: "projectsCompletedLabel", label: "Projects label", widget: "string" }
              - { name: "fixedQuotesValue", label: "Quotes stat value", widget: "string" }
              - { name: "fixedQuotesLabel", label: "Quotes stat label", widget: "string" }
              - { name: "insuredValue", label: "Insurance stat value", widget: "string" }
              - { name: "insuredLabel", label: "Insurance stat label", widget: "string" }
              - { name: "insuranceValue", label: "Insurer and cover level", widget: "string" }
              - { name: "guarantee", label: "Guarantee length", widget: "string" }
              - { name: "wasteCarrierLicence", label: "Waste carrier licence number", widget: "string" }
              - { name: "strapline", label: "Strapline", widget: "text" }
              - name: "checkatrade"
                label: "Checkatrade rating (display only)"
                widget: "object"
                hint: "REAL, verified figures. Never put these into aggregateRating structured data — a third-party platform's rating can't be marked up as the business's own."
                fields:
                  - { name: "_note", label: "Note", widget: "hidden" }
                  - { name: "rating", label: "Rating", widget: "string" }
                  - { name: "reviewCount", label: "Number of reviews", widget: "string" }
                  - { name: "memberSince", label: "Member since", widget: "string" }
                  - { name: "label", label: "Attribution label", widget: "string" }
                  - { name: "url", label: "Profile URL", widget: "string" }
              - { name: "credentialsEyebrow", label: "Credentials eyebrow", widget: "string" }
              - { name: "credentialsHeading", label: "Credentials heading", widget: "string" }
              - name: "credentials"
                label: "Credentials"
                widget: "list"
                summary: "{{fields.title}}"
                fields:
                  - { name: "title", label: "Title", widget: "string" }
                  - { name: "body", label: "Body", widget: "text" }
                  - { name: "flag", label: "Orange 'still to confirm' badge", widget: "string", required: false, hint: "Clear this once the detail is confirmed — the badge disappears." }
              - name: "accreditations"
                label: "Accreditation badges"
                widget: "list"
                summary: "{{fields.name}}"
                hint: "DELETE any the business does not actually hold."
                fields:
                  - { name: "name", label: "Name", widget: "string" }
                  - { name: "logo", label: "Logo", widget: "image", required: false }
                  - { name: "alt", label: "Alt text", widget: "string" }
                  - { name: "url", label: "Profile link", widget: "string", required: false }
                  - { name: "membershipNumber", label: "Membership number", widget: "string", required: false }

          # ---------------------------------------------------------------
          - name: "nav"
            label: "⑦ Navigation"
            widget: "object"
            fields:
              - name: "primary"
                label: "Main menu"
                widget: "list"
                fields:
                  - { name: "label", label: "Label", widget: "string" }
                  - { name: "url", label: "URL", widget: "string" }
              - name: "footerLegal"
                label: "Footer legal links"
                widget: "list"
                fields:
                  - { name: "label", label: "Label", widget: "string" }
                  - { name: "url", label: "URL", widget: "string" }

          - name: "cta"
            label: "⑧ Calls to action"
            widget: "object"
            fields:
              - { name: "primaryLabel", label: "Primary button label", widget: "string" }
              - { name: "primaryUrl", label: "Primary button URL", widget: "string" }
              - { name: "secondaryLabel", label: "Secondary button label", widget: "string" }
              - { name: "whatsappLabel", label: "WhatsApp button label", widget: "string" }
              - { name: "bandHeading", label: "Mid-page CTA heading", widget: "string" }
              - { name: "bandBody", label: "Mid-page CTA body", widget: "text" }

          - name: "form"
            label: "⑨ Quote form"
            widget: "object"
            fields:
              - { name: "heading", label: "Heading", widget: "string" }
              - { name: "intro", label: "Intro", widget: "text" }
              - { name: "submitLabel", label: "Submit button label", widget: "string" }
              - { name: "nextLabel", label: "Next button label", widget: "string" }
              - { name: "backLabel", label: "Back button label", widget: "string" }
              - { name: "stepCounter", label: "Step counter", widget: "string", hint: "Keep {n} and {total} in it, e.g. Step {n} of {total}" }
              - name: "steps"
                label: "Step titles"
                widget: "object"
                fields:
                  - { name: "job", label: "Step 1 (job type)", widget: "string" }
                  - { name: "property", label: "Step 2 (postcode and details)", widget: "string" }
                  - { name: "details", label: "Step 3 (name and phone)", widget: "string" }
              - { name: "pickJobMessage", label: "Message if Next is pressed with no job picked", widget: "string" }
              - { name: "privacyNote", label: "Privacy note", widget: "text" }
              - { name: "jobTypes", label: "Extra job type options", widget: "list", field: { name: "option", label: "Option", widget: "string" }, hint: "The services are listed on the form automatically. Add only extras here, like Not sure yet." }
              - { name: "callTimes", label: "Best time to call options", widget: "list", field: { name: "option", label: "Option", widget: "string" }, hint: "Shown as tap buttons. Leave empty to hide the question." }
              - name: "labels"
                label: "Field labels"
                widget: "object"
                fields:
                  - { name: "name", label: "Name field", widget: "string" }
                  - { name: "phone", label: "Phone field", widget: "string" }
                  - { name: "postcode", label: "Postcode field", widget: "string" }
                  - { name: "jobType", label: "Job type field", widget: "string" }
                  - { name: "message", label: "Message field", widget: "string" }
                  - { name: "callTime", label: "Best time to call field", widget: "string" }
                  - { name: "optional", label: "Word shown next to optional questions", widget: "string" }

          - name: "strip"
            label: "⑩ Trade strip"
            widget: "object"
            hint: "The row of trades under the hero."
            fields:
              - { name: "items", label: "Trades", widget: "list", field: { name: "trade", label: "Trade", widget: "string" } }

          - name: "process"
            label: "⑪ How it runs"
            widget: "object"
            fields:
              - { name: "eyebrow", label: "Eyebrow", widget: "string" }
              - { name: "heading", label: "Heading", widget: "string" }
              - { name: "intro", label: "Intro", widget: "text" }
              - name: "steps"
                label: "Steps"
                widget: "list"
                summary: "{{fields.title}}"
                fields:
                  - { name: "title", label: "Title", widget: "string" }
                  - { name: "body", label: "Description", widget: "text" }
                  - { name: "timing", label: "Timing line", widget: "string", required: false }

          - name: "differentiator"
            label: "⑫ What goes underneath"
            widget: "object"
            hint: "The build-up section. The strongest page on the site — keep the numbers honest."
            fields:
              - { name: "eyebrow", label: "Eyebrow", widget: "string" }
              - { name: "heading", label: "Heading", widget: "string" }
              - { name: "intro", label: "Intro", widget: "text" }
              - name: "buildUps"
                label: "Build-ups"
                widget: "list"
                summary: "{{fields.title}}"
                fields:
                  - { name: "title", label: "Title", widget: "string" }
                  - name: "layers"
                    label: "Layers"
                    widget: "list"
                    summary: "{{fields.label}} — {{fields.spec}}"
                    fields:
                      - { name: "label", label: "Layer", widget: "string" }
                      - { name: "spec", label: "Spec", widget: "string" }
                  - { name: "note", label: "Note underneath", widget: "text" }
              - { name: "closing", label: "Closing paragraph", widget: "text" }

          # ---------------------------------------------------------------
          - name: "services"
            label: "⑬ Services"
            widget: "list"
            summary: "{{fields.name}}  →  /services/{{fields.slug}}/"
            hint: "Each entry becomes its own page at /services/<slug>/."
            fields:
              - { name: "slug", label: "URL slug", widget: "string", pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', "Lowercase letters, numbers and hyphens only"] }
              - { name: "name", label: "Service name", widget: "string" }
              - { name: "shortName", label: "Short name (link lists)", widget: "string" }
              - { name: "eyebrow", label: "Card eyebrow", widget: "string", required: false }
              - { name: "cardSummary", label: "Card summary", widget: "text" }
              - { name: "image", label: "Image", widget: "image", required: false }
              - { name: "imageAlt", label: "Image alt text", widget: "string" }
              - { name: "h1", label: "H1", widget: "string" }
              - { name: "intro", label: "Intro (40–60 words)", widget: "text" }
              - { name: "body", label: "Main copy", widget: "text", hint: "Leave a blank line between paragraphs." }
              - { name: "bullets", label: "What's included", widget: "list", field: { name: "point", label: "Point", widget: "string" } }
              - { name: "priceLabel", label: "Price label", widget: "string", required: false }
              - { name: "priceFrom", label: "Price from (blank hides the whole block)", widget: "string", required: false }
              - name: "seo"
                label: "SEO"
                widget: "object"
                fields:
                  - { name: "title", label: "Meta title", widget: "string", pattern: ['^.{1,60}$', "60 characters max"] }
                  - { name: "description", label: "Meta description", widget: "text", pattern: ['^.{1,155}$', "155 characters max"] }

          - name: "areas"
            label: "⑭ Areas we cover"
            widget: "list"
            summary: "{{fields.name}}  →  /areas/{{fields.slug}}/"
            hint: "Each entry becomes a town hub page. Add matching entries under ⑮ for the money pages."
            fields:
              - { name: "slug", label: "URL slug", widget: "string", pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', "Lowercase letters, numbers and hyphens only"] }
              - { name: "name", label: "Town name", widget: "string" }
              - { name: "county", label: "County", widget: "string" }
              - { name: "postcodes", label: "Postcodes covered", widget: "string", required: false }
              - { name: "intro", label: "Intro (40–60 words, unique per town)", widget: "text" }
              - { name: "localReference", label: "Local reference (one true, specific detail)", widget: "text" }
              - name: "seo"
                label: "SEO"
                widget: "object"
                fields:
                  - { name: "title", label: "Meta title", widget: "string", pattern: ['^.{1,60}$', "60 characters max"] }
                  - { name: "description", label: "Meta description", widget: "text", pattern: ['^.{1,155}$', "155 characters max"] }

          - name: "locationPages"
            label: "⑮ Town + service landing pages"
            widget: "list"
            summary: "/{{fields.areaSlug}}-{{fields.serviceSlug}}/"
            hint: "The pages that rank for 'roofer Poole'. Every entry needs its OWN copy — duplicated or spun text gets treated as doorway pages."
            fields:
              - { name: "areaSlug", label: "Town slug", widget: "string", hint: "Must match a slug under Areas" }
              - { name: "serviceSlug", label: "Service slug", widget: "string", hint: "Must match a slug under Services" }
              - { name: "h1", label: "H1", widget: "string" }
              - { name: "intro", label: "Intro (120–180 unique words)", widget: "text" }
              - { name: "localReference", label: "Local reference", widget: "text" }
              - name: "seo"
                label: "SEO"
                widget: "object"
                fields:
                  - { name: "title", label: "Meta title", widget: "string", pattern: ['^.{1,60}$', "60 characters max"] }
                  - { name: "description", label: "Meta description", widget: "text", pattern: ['^.{1,155}$', "155 characters max"] }

          - name: "testimonials"
            label: "⑯ Testimonials"
            widget: "list"
            summary: "{{fields.name}} — {{fields.location}}"
            hint: "Real reviews only. Inventing these is a civil offence in the UK under the DMCC Act 2024."
            fields:
              - { name: "quote", label: "Quote", widget: "text" }
              - { name: "name", label: "Customer name", widget: "string" }
              - { name: "location", label: "Town", widget: "string" }
              - { name: "service", label: "Service slug", widget: "string", required: false }
              - { name: "rating", label: "Rating out of 5", widget: "number", value_type: "int", min: 1, max: 5 }
              - { name: "date", label: "Date", widget: "string", required: false }

          - name: "work"
            label: "Our work (photo grid)"
            widget: "list"
            summary: "{{fields.alt}}"
            hint: "Real project photographs, shown on the homepage and the gallery page. The first six appear on the homepage. Alt text describes only what is visible in the frame - no town, no date, no job title unless Kevin has confirmed it."
            fields:
              - { name: "id", label: "ID", widget: "string" }
              - { name: "image", label: "Photo", widget: "image" }
              - { name: "alt", label: "Alt text", widget: "string" }

          - name: "gallery"
            label: "⑰ Before & after gallery"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { name: "id", label: "ID", widget: "string" }
              - { name: "title", label: "Title", widget: "string" }
              - { name: "service", label: "Service slug", widget: "string", required: false }
              - { name: "area", label: "Town slug", widget: "string", required: false }
              - { name: "caption", label: "Caption", widget: "text" }
              - { name: "beforeImage", label: "Before photo", widget: "image", required: false }
              - { name: "beforeAlt", label: "Before alt text", widget: "string" }
              - { name: "afterImage", label: "After photo", widget: "image", required: false }
              - { name: "afterAlt", label: "After alt text", widget: "string" }

          - name: "faqs"
            label: "⑱ FAQs"
            widget: "list"
            summary: "{{fields.question}}"
            hint: "These also populate the FAQPage schema Google reads."
            fields:
              - { name: "question", label: "Question", widget: "string" }
              - { name: "answer", label: "Answer", widget: "text" }
              - { name: "scope", label: "Scope", widget: "select", options: ["global"], default: "global" }

          # ---------------------------------------------------------------
          - name: "pages"
            label: "⑲ Page copy"
            widget: "object"
            collapsed: true
            fields:
              - name: "home"
                label: "Home page"
                widget: "object"
                collapsed: true
                fields:
                  - { name: "seo", label: "SEO", widget: "object", fields: [
                      { name: "title", label: "Meta title", widget: "string", pattern: ['^.{1,60}$', "60 characters max"] },
                      { name: "description", label: "Meta description", widget: "text", pattern: ['^.{1,155}$', "155 characters max"] } ] }
                  - { name: "heroEyebrow", label: "Hero eyebrow", widget: "string" }
                  - { name: "heroHeadline", label: "Hero headline", widget: "string" }
                  - { name: "heroHeadlineAccent", label: "Word to italicise in the headline", widget: "string", required: false }
                  - { name: "heroSubheadline", label: "Hero sub-headline", widget: "text" }
                  - { name: "heroImage", label: "Hero image", widget: "image", required: false }
                  - { name: "heroImageAlt", label: "Hero image alt text", widget: "string" }
                  - { name: "servicesEyebrow", label: "Services eyebrow", widget: "string" }
                  - { name: "servicesHeading", label: "Services heading", widget: "string" }
                  - { name: "servicesIntro", label: "Services intro", widget: "text" }
                  - { name: "aboutEyebrow", label: "About eyebrow", widget: "string" }
                  - { name: "aboutHeading", label: "About heading", widget: "string" }
                  - { name: "aboutBody", label: "About body", widget: "text" }
                  - { name: "aboutImage", label: "About image", widget: "image", required: false }
                  - { name: "aboutImageAlt", label: "About image alt text", widget: "string" }
                  - { name: "galleryEyebrow", label: "Gallery eyebrow", widget: "string" }
                  - { name: "galleryHeading", label: "Gallery heading", widget: "string" }
                  - { name: "galleryIntro", label: "Gallery intro", widget: "text" }
                  - { name: "testimonialsEyebrow", label: "Reviews eyebrow", widget: "string" }
                  - { name: "testimonialsHeading", label: "Reviews heading", widget: "string" }
                  - { name: "testimonialsIntro", label: "Reviews intro", widget: "text", required: false }
                  - { name: "areasEyebrow", label: "Areas eyebrow", widget: "string" }
                  - { name: "areasHeading", label: "Areas heading", widget: "string" }
                  - { name: "areasIntro", label: "Areas intro", widget: "text" }
                  - { name: "faqEyebrow", label: "FAQ eyebrow", widget: "string" }
